# PostgreSQL. Versions 9.3 and up are supported.
#
#   Ensure the pg gem is defined in your Gemfile
#   gem "pg"
#
#   開発・テストのDBは、compose.yaml の db サービス(Docker)に接続する。
#   起動: docker compose up -d
#   DB作成: rails db:create db:schema:load
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USERNAME") { "loopworks" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "password" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: loopworks_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: loopworks_test


# 本番(Render)は、環境変数 DATABASE_URL で接続する。
# DATABASE_URL が設定されていれば、Railsが自動で読み、ここの設定にマージされる。
# 接続情報をリポジトリに入れないため、本番にはパスワードを書かない。
production:
  <<: *default
  database: loopworks_production